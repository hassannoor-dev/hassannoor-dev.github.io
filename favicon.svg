<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Tile: electric blue, lighter top-left to deeper bottom-right -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6087FF"/>
      <stop offset="1" stop-color="#2242DE"/>
    </linearGradient>
    <!-- Soft light from the top -->
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#0a1978" flood-opacity=".47"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#tile)"/>
  <rect width="512" height="512" rx="115" fill="url(#sheen)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="#fff" stroke-opacity=".24"/>

  <!-- The </> symbol -->
  <g fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M180 172 100 256 180 340"/>
    <path d="M332 172 412 256 332 340"/>
    <path d="M290 146 222 366"/>
  </g>

  <!-- Sparkles (same 4-point star as the site) -->
  <g fill="#fff">
    <path fill-opacity=".92" transform="translate(408 112) scale(2.833) translate(-12 -12)" d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/>
    <path fill-opacity=".67" transform="translate(118 402) scale(1.25) translate(-12 -12)" d="M12 0C12 7 17 12 24 12C17 12 12 17 12 24C12 17 7 12 0 12C7 12 12 7 12 0Z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
